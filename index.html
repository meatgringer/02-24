<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelCalc</title>
    <link rel="stylesheet" href="calc.css">
    <link rel="icon" type="image/png" href="air.png">
</head>
<body>

    <div class="CalcMeangrinder">
        <header class="calc-header">
            <br><br><br>
            <h1> Калькулятор путешествий </h1>
            <br>
        </header>


        <nav class="tabs">  <!-- блок -->
            <button class="tab-btn active" data-tab="currency">Валюта</button> <!-- 1 подблок -->
            <button class="tab-btn" data-tab="translator">Переводчик</button> <!-- 2 подблок -->
            <button class="tab-btn" data-tab="temperature">Температура</button> <!-- 3 подблок -->
            <button class="tab-btn" data-tab="tips">Счетчик</button> <!-- 4 подблок -->
        </nav>

        <section class="tab-content active" id="tab-currency">
            <div class="form-group">
                <label for="text"> Сумма</label>
                <input type="number" id="text" min="0" step="0.1" placeholder="Введите сумму...">
            </div>
            
            <div class="converter-row"> 
                <div class="form-group">
                    <select id="from-currency"> <!-- выбор валюты -->
                        <option value="RUB" selected>RUB - Российский рубль</option> <!-- selected - выбрать отображаемую валюту в первую очередь -->
                        <option value="USD">USD - Доллар</option>
                        <option value="EUR">EUR - Евро</option>
                        <option value="BYN">BYN - Белорусский рубль</option>
                        <option value="KZT">KZT - Тенге</option>
                        <option value="CNY">CNY - Юань</option>
                        <option value="THB">THB - Бат</option>
                    </select>
                </div>

                <button class="swap-btn" id="swap-currencies" title="поменять валюты местами">⇄</button> 

                <div class="form-group">
                    <select id="to-currency"> <!-- 2 выбор валюты -->
                        <option value="RUB">RUB - Российский рубль</option>
                        <option value="USD" selected>USD - Доллар</option>
                        <option value="EUR">EUR - Евро</option>
                        <option value="BYN">BYN - Белорусский рубль</option>
                        <option value="KZT">KZT - Тенге</option>
                        <option value="CNY">CNY - Юань</option>
                        <option value="THB">THB - Бат</option>
                    </select>
                </div>
            </div>


            <div class="result-box" id="currency-result"> ? </div>
            <p class="info-note">! update: 11.05.2026 !</p> <!-- дата ручного обновления валюты -->
        </section>



        <section class="tab-content" id="tab-translator">
            <div class="form-group">
        <div class="translator-block"> <!-- расположение нижнего блока -->
            
            <div class="translator-form">
                <div class="form-group">
                    <label for="translate-text">Текст для перевода</label>
                    <input id="translate-text" step="0.1" placeholder="Введите текст..."></input>
                </div>
                
                <div class="converter-row">
                    <div class="form-group">
                        <select id="translate-from">
                            <option value="ru" selected>Русский</option> <!-- выбранный русский -->
                            <option value="en">Английский</option>
                            <option value="de">Немецкий</option>
                            <option value="fr">Французский</option>
                        </select>
                    </div>
                    
                    <button class="swap-btn" onclick="TranslatesLanguages()" title="поменять языки местами">⇄</button> <!-- onclick="TranslatesLanguages() — это вызов функции при клике -->
                    
                    <div class="form-group">
                        <select id="translate-to">
                            <option value="ru">Русский</option>
                            <option value="en" selected>Английский</option> <!-- выбрать и перевести на английский-->
                            <option value="de">Немецкий</option>
                            <option value="fr">Французский</option>
                        </select>
                    </div>
                </div>
                
                <div class="result-box" id="translate-result" word-wrap: break-word;> 
                </div>
            </div>
        </div>
            </div>
        </section>



        <section class="tab-content" id="tab-temperature">
            <div class="form-group">
                <label for="temp-value">Температура</label>
                <input type="number" id="temp-value" step="0.1" placeholder="Введите температуру...">
            </div>

            <div class="converter-row">
                <div class="form-group">
                    <select id="temp-from">
                        <option value="F">°F — Фаренгейт </option>
                        <option value="C">°C — Цельсий </option>
                    </select>
                </div>

                <button class="swap-btn" id="swap-temp" title="поменять шкалы местами">⇄</button>

                <div class="form-group">
                    <select id="temp-to">
                        <option value="C">°C — Цельсий </option>
                        <option value="F">°F — Фаренгейт </option>
                    </select>
                </div>
            </div>

            <div class="result-box" id="temp-result">25°C = 77°F</div>
        </section>




        <section class="tab-content" id="tab-tips">
            <div class="form-group">
                <label for="bill-amount">Полная цена</label> <!-- цена -->
                <input type="number" id="bill-amount" min="0" step="0.01" placeholder="Введите цену...">
            </div>

            <div class="form-group">
            <label for="tip-percent">Скидка(в процентах)</label> <!-- скидка -->
                <input type="number" id="tip-percent" min="0" max="100" step="0.01" placeholder="Введите скидку...">
            </div>

            <div class="form-group">
                <label for="people-count">Количество человек</label> <!-- на скольких делить счет -->
                <input type="number" id="people-count" value="1" min="1" max="30" placeholder="Введите количество...">
            </div>

            <div class="result-box multi-line" id="tips-result"> <!-- вывод -->
                <span>Процент: 0 руб</span>
                <span>Итого: 0 руб</span>
                <span>Раздельный счет: 0 руб</span>
            </div>

        </section>


    <div class="calculator"></div>
    <br><br><br><br><br><br><br><br><br><br> <!-- лень было делать нормальные отступы -->

    <footer class="footer"> <!-- нижний блок -->
        <div class="footer-content">
            <div class="footer-links">
                <a href="privacy.html" class="footer-link">Политика конфиденциальности</a> <!-- ссылка переход-->
                <span class="footer-divider">|</span>
                <a href="agreement.html" class="footer-link">Пользовательское соглашение</a> <!-- переход ссылка -->
            </div>
            <div class="footer-copyright">
                © 2026 meangrinder. Все права защищены
            </div>
        </div>
    </footer>


</body>
</html>

<script src="index.js"></script>
