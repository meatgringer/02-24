<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelCalc</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="CalcMeangrinder">
        <header class="calc-header">
            <br><br><br><br>
            <h1> Калькулятор путешествий </h1>
            <br>
        </header>


        <nav class="tabs">
            <button class="tab-btn active" data-tab="currency">Валюта</button>
            <button class="tab-btn" data-tab="translator">Переводчик</button>
            <button class="tab-btn" data-tab="temperature">Температура</button>
            <button class="tab-btn" data-tab="tips">Счетчик</button>
        </nav>

        <section class="tab-content active" id="tab-currency">
            <div class="form-group">
                <label for="currency-amount"> Сумма</label>
                <input type="number" id="currency-amount" value="1" min="0" step="0.1" placeholder="Введите сумму">
            </div>
            
            <div class="converter-row">
                <div class="form-group">
                    <select id="from-currency">
                        <option value="RUB" selected>RUB - Рубль</option>
                        <option value="USD">USD - Доллар</option>
                        <option value="EUR">EUR - Евро</option>
                        <option value="BYN">BYN - Рубль</option>
                        <option value="KZT">KZT - Тенге</option>
                        <option value="CNY">CNY - Юань</option>
                        <option value="THB">THB - Бат</option>
                    </select>
                </div>

                <button class="swap-btn" id="swap-currencies" title="Поменять валюты местами">⇄</button>

                <div class="form-group">
                    <select id="to-currency">
                        <option value="RUB">RUB - Российский рубль</option>
                        <option value="USD" selected>USD - Доллар</option>
                        <option value="EUR">EUR - Евро</option>
                        <option value="BYN">BYN - Белорусский рубль</option>
                        <option value="KZT">KZT - Тенге</option>
                        <option value="CNY">CNY - Юань</option>
                        <option value="THB">THB - Бат</option>
                    </select>
                </div>
            </div>


            <div class="result-box" id="currency-result"> ? </div>
            <p class="info-note">! update: 11.05.2026 !</p>
        </section>





        <section class="tab-content" id="tab-translator">
            <div class="form-group">
        <div class="translator-block">
            
            <div class="translator-form">
                <div class="form-group">
                    <label for="translate-text">Текст для перевода</label>
                    <textarea id="translate-text" rows="3" placeholder="Введите текст..."></textarea>
                </div>
                
                <div class="converter-row">
                    <div class="form-group">
                        <select id="translate-from">
                            <option value="ru" selected>Русский</option>
                            <option value="en">Английский</option>
                            <option value="de">Немецкий</option>
                            <option value="fr">Французский</option>
                            <option value="zh">Китайский</option>
                            <option value="th">Тайский</option>
                        </select>
                    </div>
                    
                    <button class="swap-btn" onclick="swapTranslateLanguages()" title="Поменять языки">⇄</button>
                    
                    <div class="form-group">
                        <select id="translate-to">
                            <option value="ru">Русский</option>
                            <option value="en" selected>Английский</option>
                            <option value="de">Немецкий</option>
                            <option value="fr">Французский</option>
                            <option value="zh">Китайский</option>
                            <option value="th">Тайский</option>
                        </select>
                    </div>
                </div>
                
                <div class="result-box" id="translate-result" style="font-size: 16px; word-wrap: break-word;">
                </div>
            </div>
        </div>
            </div>
        </section>




        <section class="tab-content" id="tab-temperature">
            <div class="form-group">
                <label for="temp-value">Температура</label>
                <input type="number" id="temp-value" value="50" step="0.1" placeholder="Введите температуру">
            </div>

            <div class="converter-row">
                <div class="form-group">
                    <select id="temp-from">
                        <option value="F">°F — Фаренгейт </option>
                        <option value="C">°C — Цельсий </option>
                    </select>
                </div>

                <button class="swap-btn" id="swap-temp" title="Поменять шкалы местами">⇄</button>

                <div class="form-group">
                    <select id="temp-to">
                        <option value="C">°C — Цельсий </option>
                        <option value="F">°F — Фаренгейт </option>
                    </select>
                </div>
            </div>

            <div class="result-box" id="temp-result">25°C = 77°F</div>
        </section>





        <section class="tab-content" id="tab-tips">
            <div class="form-group">
                <label for="bill-amount">Сумма</label>
                <input type="number" id="bill-amount" value="2500" min="0" step="0.01" placeholder="Введите цену">
            </div>

            <div class="form-group">
            <label for="tip-percent">Скидка(в процентах)</label>
                <input type="number" id="tip-percent" value="25%" min="0" step="0.01" placeholder="Введите скидку">
            </div>

            <div class="form-group">
                <label for="people-count">Количество человек</label>
                <input type="number" id="people-count" value="2" min="1" max="50" placeholder="Введите количество">
            </div>

            <div class="result-box multi-line" id="tips-result">
                <span>Процент: 375 руб</span>
                <span>Итого: 2 875 руб</span>
                <span>Раздельный счет: 1 437.50 руб</span>
            </div>

        </section>







    <div class="calculator"></div>
    <br><br><br><br><br><br>
    <br><br><br><br>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="#" class="footer-link">Политика конфиденциальности</a>
                <span class="footer-divider">|</span>
                <a href="#" class="footer-link">Пользовательское соглашение</a>
            </div>
            <div class="footer-copyright">
                © 2026 meangrinder. Все права защищены
            </div>
        </div>
    </footer>


</body>
</html>

<script src="index.js"></script>
